# deadpool.toml - next to deadpool.nro on the SD card (sdmc:/switch/deadpool/).

# Handheld GPU clock requested from the system (0 = leave it, 384, 460): official Horizon modes, not an overclock.
deadpool_switch_gpu_mhz = 460

# Handheld CPU clock kept by the NRO (0 = leave it at 1020, 1224, 1581, 1785). 1785 MHz is the console's own boost
# clock, set through clkrst as sys-clk does. Uses more battery.
deadpool_switch_cpu_mhz = 1785

# Scene resolution at startup: 720 (the game's 1280x720) or 540 (960x540, scaled to the screen). Game patch 3, as
# gears2-nx 1.1.0's 540p mode, plus a 960x540 video mode for the UI and back buffer.
deadpool_resolution = 540

# Never compile a shader variant while playing: one missing from the DKSH cache keeps drawing with the general
# variant (the same image). A runtime compile took a game core for 30+ s and the sound crackled.
nfsmw_dk_compilar_variantes = false

# Occlusion: never answer with the previous frame's result (true): in Singularity objects blinked at edges, in Deadpool
# the world and objects flickered.
deadpool_oclusion_anterior = false
# A visibility result the GPU has not counted yet when the game waits for it: wait for the count (up to
# deadpool_oclusion_espera_ms, 40) instead of answering "visible" after 3 ms. Answered visible, 14,613 of 24,056 queries
# in one session, and the lights' coronas shone through walls.
deadpool_oclusion_sin_esperar_ms = -1

# Depth prepasses drawn (false = drawn): Deadpool copies the scene depth right after them, before the base pass, and its
# screen-space shadows (the apartment's blinds) and depth of field (the first level all blurred) read that copy.
deadpool_sin_prepaso_z = false
deadpool_sin_prepaso_enmascarado = false
# The base pass tests GEQUAL against the prepass's depth, as on the Xbox. It failed everywhere (the world black)
# because the translator sent the depth-only vertex shaders' position fetch through the shader's own vertex read
# (dsVfetch) while the base pass got the same positions as vertex attributes: measured per vertex, every environment
# surface came out at a different depth (fixed in XenosRecomp: a fetch into r0 took itself for a rewrite of r0).
# true = the old workaround: clear the depth before the base pass and let it write its own.
deadpool_pase_base_propia_z = false
# The first-person weapon's depth merged into the depth the depth of field reads (on). Off: in front of the sky or a
# window the weapon was half replaced by the blurred background and looked see-through.
deadpool_dof_arma = true

# Singularity's audio changes, off until shown to work for Deadpool. In one session the sound stuck on one repeated
# note and the level load never finished: a game thread kicked one XMA context ~600,000 times a second with nothing
# decoded.
# audio_xma_fin_tras_drenar (SDK patch 0009): holds back "input used up" until the game reads the output; measured
# on Singularity's XAudio2. false = upstream rexglue's behaviour (deadpool-recomp's, which works).
audio_xma_fin_tras_drenar = false
# The game's XAudio2 state-variable filters as native code (switch/src/deadpool_perf_hooks.cpp): false = the game's own.
deadpool_audio_filtro_nativo = false
